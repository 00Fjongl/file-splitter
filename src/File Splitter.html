<!DOCTYPE html>
<html lang=en>
<head>
<meta charset=UTF-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>File Splitter</title>
<style>
#fileDisplay{display:grid}#fileDisplay>*{cursor:copy}
</style>
</head>
<body>
<input type=text placeholder="Chunk Size (bits), 0-8000000" value=8000000>
<br>
<a onclick=this.nextElementSibling.click()>Split File</a>
<input type=file style=display:none>
<br>
<a onclick=this.nextElementSibling.click()>Unsplit File</a>
<input type=file multiple style=display:none>
<br>
<div id=fileDisplay><a>Download all</a></div>
<script src=./file-io.js></script>
</body>
</html>
